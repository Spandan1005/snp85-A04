<!-- Tells the browser this file is an HTML5 document -->
<!DOCTYPE html>
<!-- Opens the root element; lang="en" says the page is in English -->
<html lang="en">
<!-- Opens the head section, which holds information about the page (not shown on the page) -->
<head>
    <!-- Sets the character encoding so letters and symbols (like the copyright sign) display correctly -->
    <meta charset="UTF-8">
    <!-- Makes the page scale properly on phones and small screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the title shown on the browser tab -->
    <title>My First Web Page</title>
<!-- Closes the head section -->
</head>
<!-- Opens the body section, which holds everything visible on the page -->
<body>
    <!-- Main heading (largest heading) for the page -->
    <h1>My First Web Page</h1>

    <!-- Paragraph showing my username; replace YOUR_UCID with your real UCID -->
    <p>Username: snp85</p>
    <!-- Paragraph showing the course name; replace with your exact course name -->
    <p>Course Name: Introduction to Website Development</p>
    <!-- Paragraph showing the course number -->
    <p>Course Number: IS 117</p>
    <!-- Paragraph showing my section; replace with your section (for example 002) -->
    <p>Section: 001</p>

    <!-- Opens the footer, which holds closing information at the bottom of the page -->
    <footer>
        <!-- &copy; displays the copyright symbol, followed by my name and the due date -->
        <p>&copy; Spandan Patel - Due Date: October 6, 2026 (10/6/26)</p>
    <!-- Closes the footer -->
    </footer>
<!-- Closes the body section -->
</body>
<!-- Closes the root html element, ending the document -->
</html>
